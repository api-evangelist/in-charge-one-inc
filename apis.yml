name: In Charge One, Inc.
description: >-
  In Charge One, Inc. is a hardware startup behind "Socket to Pocket," a paid
  charging system for electronic devices in public spaces. The device lets
  visitors charge smartphones, laptops, drones, e-bikes, and scooters at cafes,
  shops, clinics, stadiums, airports, and other venues by tapping a card and
  paying for access, while venue owners monetize the outlet and earn a
  commission per plugged socket. It ships in wall-mounted, extension-cord, and
  anti-vandal street versions. Founded in 2023 by Danylo (Daniel) Tonkopii,
  co-founder of Delfast electric bikes, and Andriy Zinchuk, the company is based
  in Los Angeles, California and was developed by Ukrainian engineers. It is a
  consumer/commercial hardware and payments business, not an API provider: no
  public API, developer portal, or documentation surface has been published, and
  its incharge.one domain is currently non-resolving and in registrar
  redemption/pending-delete status. This profile was surfaced as a portfolio
  company of 500 Global and is retained as an identity record.
